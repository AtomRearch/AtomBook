<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
<script src="https://unpkg.com/epubjs/dist/epub.min.js"></script>
<style>
:root {
  --bg:#FBF7F0; --text:#1A1A1A; --text-muted:#888;
  --border:rgba(0,0,0,0.08); --bar-bg:rgba(251,247,240,0.94);
  --hover:rgba(0,0,0,0.05); --panel-bg:#F2EDE4;
  --accent:#6B5340; --shadow:rgba(0,0,0,0.10);
}
[data-theme="sepia"] {
  --bg:#F5E9D5; --text:#3B2E1E; --text-muted:#9A7E62;
  --border:rgba(59,46,30,0.10); --bar-bg:rgba(245,233,213,0.94);
  --hover:rgba(59,46,30,0.06); --panel-bg:#EDE0C8;
  --accent:#8B5E3C; --shadow:rgba(59,46,30,0.12);
}
[data-theme="night"] {
  --bg:#1C1C1E; --text:#E5E0D8; --text-muted:#6E6E73;
  --border:rgba(255,255,255,0.07); --bar-bg:rgba(28,28,30,0.94);
  --hover:rgba(255,255,255,0.06); --panel-bg:#2C2C2E;
  --accent:#C8A87A; --shadow:rgba(0,0,0,0.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;}
button{cursor:pointer;font-family:inherit;}
textarea,input{font-family:inherit;}
.flamingo-mark{color:var(--accent);display:block;}

/* ── Library ── */
#library{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  background:var(--bg);transition:background .3s;overflow:hidden;}
#library.drag-over{background:var(--panel-bg);}
.lib-header{height:56px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--border);
  background:var(--bar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.lib-logo-row{display:flex;align-items:center;gap:9px;}
.lib-flamingo{width:20px;height:22px;flex-shrink:0;}
.lib-wordmark{font-family:'TNT Sports Serif','Spectral','Noto Serif SC',Georgia,serif;
  font-size:19px;font-weight:400;letter-spacing:-.2px;color:var(--text);opacity:.85;}
.lib-open-btn{padding:7px 18px;border-radius:20px;border:1.5px solid var(--border);
  background:transparent;color:var(--text);font-size:13px;font-weight:400;
  transition:background .15s,border-color .15s;}
.lib-open-btn:hover{background:var(--hover);border-color:var(--accent);}
.lib-body{flex:1;overflow-y:auto;padding:24px 22px 0;}
.lib-body::-webkit-scrollbar{width:3px;}
.lib-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.lib-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:60vh;gap:14px;}
.lib-empty-flamingo{width:54px;height:60px;opacity:.22;color:var(--text);}
.lib-empty-text{font-size:14px;color:var(--text-muted);font-weight:300;}
.lib-empty-btn{padding:9px 28px;border-radius:22px;border:1.5px solid var(--border);
  background:transparent;color:var(--text);font-size:13.5px;
  transition:background .15s,border-color .15s;}
.lib-empty-btn:hover{background:var(--hover);border-color:var(--accent);}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  gap:20px 16px;padding-bottom:24px;}
.book-card{cursor:pointer;position:relative;transition:transform .18s ease;}
.book-card:hover{transform:translateY(-3px);}
.bc-cover{aspect-ratio:2/3;border-radius:7px;overflow:hidden;position:relative;
  box-shadow:0 4px 18px var(--shadow),0 1px 4px rgba(0,0,0,.12);background:var(--panel-bg);}
.bc-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.bc-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:12px;}
.bc-ph-letter{font-family:'TNT Sports Serif','Spectral',Georgia,serif;font-size:36px;
  font-weight:400;color:rgba(255,255,255,0.80);line-height:1;}
.bc-ph-title{font-size:8.5px;font-weight:500;color:rgba(255,255,255,0.55);
  text-align:center;margin-top:9px;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:3;-webkit-box-orient:vertical;line-height:1.4;}
.bc-del{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,0.52);border:none;color:#fff;font-size:11px;line-height:1;
  display:none;align-items:center;justify-content:center;z-index:5;transition:background .15s;}
.book-card:hover .bc-del{display:flex;}
.bc-del:hover{background:rgba(200,0,0,.80);}
.bc-info{padding:7px 2px 0;}
.bc-title{font-size:11.5px;font-weight:500;color:var(--text);overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4;}
.bc-author{font-size:10.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:3px;}
.bc-prog{height:2px;background:var(--border);border-radius:1px;margin-top:6px;overflow:hidden;}
.bc-prog-fill{height:100%;background:var(--accent);border-radius:1px;}
.lib-footer{height:44px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 22px;border-top:1px solid var(--border);}
.lib-themes{display:flex;gap:9px;}
.lib-dot{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;
  transition:transform .15s,border-color .15s;}
.lib-dot:hover{transform:scale(1.15);}
.lib-dot.on{border-color:var(--accent);}
.lib-dot[data-t="day"]  {background:#FBF7F0;box-shadow:0 0 0 1px rgba(0,0,0,.14);}
.lib-dot[data-t="sepia"]{background:#F5E9D5;box-shadow:0 0 0 1px rgba(0,0,0,.10);}
.lib-dot[data-t="night"]{background:#1C1C1E;box-shadow:0 0 0 1px rgba(255,255,255,.12);}
.lib-sync-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);opacity:.35;
  flex-shrink:0;transition:background .3s,opacity .3s;}
.sync-dot.on{background:#34C759;opacity:1;}
.lib-sync-btn{padding:3px 10px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--text-muted);font-size:11px;transition:all .15s;}
.lib-sync-btn:hover{background:var(--hover);color:var(--text);}

/* ── Reader ── */
#reader{position:fixed;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .4s ease;}
#reader.on{opacity:1;pointer-events:all;}
#toolbar{height:46px;flex-shrink:0;display:flex;align-items:center;padding:0 14px;
  background:var(--bar-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);transition:background .3s;
  position:relative;z-index:60;user-select:none;}
.tb-left,.tb-right{display:flex;align-items:center;gap:2px;flex:1;}
.tb-right{justify-content:flex-end;}
.tb-center{flex:2;text-align:center;overflow:hidden;}
.tb-title{font-family:'TNT Sports Serif','Spectral','Noto Serif SC',serif;font-size:13.5px;
  font-weight:400;color:var(--text);opacity:.62;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:280px;margin:0 auto;}
.tb-flamingo{width:16px;height:18px;display:block;}
.tb-btn{width:30px;height:30px;border-radius:7px;border:none;background:transparent;
  color:var(--text);display:flex;align-items:center;justify-content:center;font-size:13px;
  opacity:.58;transition:background .15s,opacity .15s;}
.tb-btn:hover{background:var(--hover);opacity:1;}
.tb-btn.lit{opacity:1;background:var(--hover);}
.tb-sep{width:1px;height:16px;background:var(--border);margin:0 4px;}
.fs-num{font-size:11.5px;color:var(--text-muted);min-width:22px;text-align:center;
  pointer-events:none;font-variant-numeric:tabular-nums;}
#reader-area{flex:1;position:relative;overflow:hidden;display:flex;align-items:stretch;}
#epub-viewer{flex:1;position:relative;}
#epub-viewer::after{content:'';position:absolute;top:6%;bottom:6%;left:50%;width:1px;
  background:linear-gradient(to bottom,transparent 0%,var(--border) 18%,
  rgba(0,0,0,0.09) 50%,var(--border) 82%,transparent 100%);
  pointer-events:none;z-index:5;display:none;}
#epub-viewer.spread::after{display:block;}
.nav-btn{position:absolute;top:0;bottom:0;width:54px;border:none;background:none;
  display:flex;align-items:center;justify-content:center;z-index:10;opacity:0;transition:opacity .2s;}
#reader-area:hover .nav-btn{opacity:1;}
#prev-btn{left:0;} #next-btn{right:0;}
.nav-chev{width:8px;height:16px;color:var(--text);opacity:.28;transition:opacity .15s;}
.nav-btn:hover .nav-chev{opacity:.72;}
#bottom-bar{height:34px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 22px;background:var(--bar-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);transition:background .3s;}
#ch-title{font-size:11px;color:var(--text-muted);font-weight:300;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:55%;letter-spacing:.12px;}
.prog-row{display:flex;align-items:center;gap:10px;}
#prog-track{width:88px;height:2px;background:var(--border);border-radius:1px;overflow:hidden;}
#prog-fill{height:100%;width:0%;background:var(--accent);border-radius:1px;transition:width .4s ease;}
#prog-pct{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap;}

@keyframes leafNext{
  0%{transform:translateX(0);opacity:1;}
  30%{transform:translateX(-20px);opacity:0;}
  31%{transform:translateX(20px);opacity:0;}
  100%{transform:translateX(0);opacity:1;}
}
@keyframes leafPrev{
  0%{transform:translateX(0);opacity:1;}
  30%{transform:translateX(20px);opacity:0;}
  31%{transform:translateX(-20px);opacity:0;}
  100%{transform:translateX(0);opacity:1;}
}
.anim-next{animation:leafNext .30s cubic-bezier(.4,0,.2,1);}
.anim-prev{animation:leafPrev .30s cubic-bezier(.4,0,.2,1);}

/* ── Panels ── */
.panel{position:fixed;top:0;bottom:0;width:290px;background:var(--panel-bg);
  transition:transform .28s cubic-bezier(.4,0,.2,1),background .3s;z-index:120;display:flex;flex-direction:column;}
#toc-panel{left:0;border-right:1px solid var(--border);transform:translateX(-100%);box-shadow:4px 0 30px var(--shadow);}
#note-panel{right:0;border-left:1px solid var(--border);transform:translateX(100%);box-shadow:-4px 0 30px var(--shadow);}
#toc-panel.open{transform:translateX(0);}
#note-panel.open{transform:translateX(0);}
.panel-head{height:50px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);}
.panel-label{font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);}
.panel-x{width:26px;height:26px;border-radius:6px;border:none;background:transparent;
  color:var(--text);display:flex;align-items:center;justify-content:center;font-size:14px;
  opacity:.42;transition:opacity .15s,background .15s;}
.panel-x:hover{opacity:1;background:var(--hover);}
.panel-body{flex:1;overflow-y:auto;padding:8px 0;}
.panel-body::-webkit-scrollbar{width:3px;}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.toc-row{display:block;width:100%;text-align:left;border:none;background:none;color:var(--text);
  font-family:'TNT Sports Serif','Spectral','Noto Serif SC',serif;font-size:14px;font-weight:400;
  line-height:1.45;padding:9px 18px;cursor:pointer;transition:background .12s;}
.toc-row:hover{background:var(--hover);}
.toc-row.cur{color:var(--accent);}
.toc-row[data-d="2"]{padding-left:32px;font-size:13px;opacity:.82;}
.toc-row[data-d="3"]{padding-left:46px;font-size:12px;opacity:.65;}
.note-row{padding:14px 18px;border-bottom:1px solid var(--border);transition:background .12s;}
.note-row:hover{background:var(--hover);}
.note-quote{font-family:'TNT Sports Serif','Spectral','Noto Serif SC',serif;font-size:13px;
  line-height:1.55;color:var(--text);padding-left:9px;position:relative;margin-bottom:5px;}
.note-quote::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:2.5px;border-radius:1.5px;}
[data-c="yellow"] .note-quote::before{background:#D4A017;}
[data-c="green"]  .note-quote::before{background:#3A9C5F;}
[data-c="blue"]   .note-quote::before{background:#4A78C4;}
[data-c="pink"]   .note-quote::before{background:#C8455A;}
.note-body{font-size:12px;color:var(--text-muted);line-height:1.5;}
.note-acts{display:flex;gap:4px;margin-top:8px;}
.note-act{font-size:11px;padding:2px 8px;border-radius:5px;border:none;background:transparent;
  color:var(--text-muted);transition:all .12s;}
.note-act:hover{background:var(--hover);color:var(--text);}
.note-act.del:hover{color:#FF3B30;}
.panel-empty{padding:36px 18px;text-align:center;font-size:13px;color:var(--text-muted);line-height:1.7;}

/* ── Selection bar ── */
#sel-bar{position:fixed;z-index:300;display:none;align-items:center;gap:3px;
  background:var(--bar-bg);border:1px solid var(--border);border-radius:10px;padding:5px 7px;
  box-shadow:0 6px 24px var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .3s;}
#sel-bar.on{display:flex;}
.sel-dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.5);transition:transform .12s,border-color .12s;}
.sel-dot:hover{transform:scale(1.2);border-color:rgba(255,255,255,.9);}
.sel-dot[data-c="yellow"]{background:#D4A017;}
.sel-dot[data-c="green"] {background:#3A9C5F;}
.sel-dot[data-c="blue"]  {background:#4A78C4;}
.sel-dot[data-c="pink"]  {background:#C8455A;}
.sel-sep{width:1px;height:16px;background:var(--border);margin:0 3px;}
.sel-note-btn{font-size:12px;padding:1px 8px;border-radius:6px;border:none;
  background:transparent;color:var(--text);transition:background .12s;}
.sel-note-btn:hover{background:var(--hover);}

/* ── Note modal ── */
#note-modal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.38);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:opacity .2s;}
#note-modal.on{opacity:1;pointer-events:all;}
.note-card{background:var(--panel-bg);border-radius:18px;width:370px;max-width:92vw;padding:22px;
  box-shadow:0 24px 64px rgba(0,0,0,.22);transition:background .3s;}
.note-card-quote{font-family:'TNT Sports Serif','Spectral','Noto Serif SC',serif;font-size:13.5px;
  line-height:1.6;color:var(--text);opacity:.72;margin-bottom:14px;padding-left:11px;
  border-left:2.5px solid var(--accent);}
.note-ta{width:100%;min-height:96px;background:rgba(128,128,128,.07);border:1.5px solid var(--border);
  border-radius:10px;padding:11px 13px;resize:vertical;font-size:14px;color:var(--text);
  outline:none;transition:border-color .15s;}
.note-ta:focus{border-color:var(--accent);}
.note-ta::placeholder{color:var(--text-muted);}
.note-card-acts{display:flex;justify-content:flex-end;gap:7px;margin-top:11px;}
.nc-btn{padding:7px 17px;border-radius:8px;border:none;font-size:13.5px;transition:all .15s;}
.nc-btn.cancel{background:transparent;color:var(--text-muted);}
.nc-btn.cancel:hover{background:var(--hover);}
.nc-btn.save{background:var(--accent);color:#fff;}
.nc-btn.save:hover{opacity:.85;}

/* ── Appearance popup ── */
#theme-pop{position:absolute;top:50px;right:12px;background:var(--panel-bg);
  border:1px solid var(--border);border-radius:12px;padding:6px;
  box-shadow:0 8px 28px var(--shadow);display:none;flex-direction:column;gap:1px;
  z-index:80;min-width:178px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .3s;}
#theme-pop.on{display:flex;}
.tp-section{font-size:10px;font-weight:500;letter-spacing:.7px;text-transform:uppercase;
  color:var(--text-muted);padding:4px 11px 2px;}
.tp-opt{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:7px;
  border:none;background:none;color:var(--text);font-size:13px;width:100%;text-align:left;transition:background .12s;}
.tp-opt:hover{background:var(--hover);}
.tp-opt.cur{color:var(--accent);}
.tp-sw{width:17px;height:17px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.12);}
.tp-divider{height:1px;background:var(--border);margin:4px 8px;}
.tp-font{display:flex;align-items:center;padding:6px 11px;border-radius:7px;
  border:none;background:none;color:var(--text);font-size:13px;width:100%;
  text-align:left;transition:background .12s;gap:8px;}
.tp-font:hover{background:var(--hover);}
.tp-font.cur{color:var(--accent);}
.tp-font-name{flex:1;text-align:left;}
.tp-font-type{font-size:10px;color:var(--text-muted);flex-shrink:0;}
.tp-font.cur .tp-font-type{color:var(--accent);opacity:.7;}
.tp-check{font-size:11px;opacity:0;flex-shrink:0;}
.tp-font.cur .tp-check{opacity:1;}

#overlay{position:fixed;inset:0;z-index:100;display:none;}
#overlay.on{display:block;}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
</style>
</head>
<body data-theme="sepia">

<!-- LIBRARY -->
<div id="library">
  <div class="lib-header">
    <div class="lib-logo-row">
      <svg class="lib-flamingo flamingo-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="currentColor">

/* Font map */
const FONTS = {
  tnt:     {label:'TNT Sports Serif', stack:'"TNT Sports Serif","Noto Serif SC",Georgia,serif'},
  spectral:{label:'Spectral',          stack:'"Spectral","Noto Serif SC",Georgia,serif'},
  georgia: {label:'Georgia',           stack:'Georgia,"Noto Serif SC",serif'},
  noto:    {label:'Noto Serif SC',     stack:'"Noto Serif SC",Georgia,serif'},
  inter:   {label:'Inter',             stack:'"Inter",system-ui,sans-serif'},
};

/* State */
let book=null,rend=null,bookId=null;
let allData={v:1,books:{}};
let syncDir=null;
let theme='sepia',fontSize=18,fontKey='tnt';
let animating=false;
let selCfi=null,selText=null,pendingHl=null,nmCb=null;
const HL_FILLS={yellow:'rgba(212,160,23,.38)',green:'rgba(58,156,95,.36)',blue:'rgba(74,120,196,.36)',pink:'rgba(200,69,90,.34)'};
const COVER_COLORS=['#8B5E3C','#4A78C4','#3A9C5F','#C4693A','#6B5340','#C8455A','#7B5EA7'];

/* DOM */
const $=id=>document.getElementById(id);
const library=$('library'),reader=$('reader'),epubViewer=$('epub-viewer');
const selBar=$('sel-bar'),noteModal=$('note-modal'),overlay=$('overlay');

/* IDB v2 */
function openIDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('atombook_v1',2);
    r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');if(!db.objectStoreNames.contains('books'))db.createObjectStore('books');};
    r.onsuccess=e=>res(e.target.result);r.onerror=rej;
  });
}
async function idbGet(store,k){const db=await openIDB();return new Promise((res,rej)=>{const r=db.transaction(store,'readonly').objectStore(store).get(k);r.onsuccess=e=>res(e.target.result);r.onerror=rej;});}
async function idbSet(store,k,v){const db=await openIDB();return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(v,k);tx.oncomplete=res;tx.onerror=rej;});}
async function idbDel(store,k){const db=await openIDB();return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(k);tx.oncomplete=res;tx.onerror=rej;});}
async function idbGetAll(store){
  const db=await openIDB();
  return new Promise((res,rej)=>{
    const rows=[],req=db.transaction(store,'readonly').objectStore(store).openCursor();
    req.onsuccess=e=>{const c=e.target.result;if(c){rows.push({key:c.key,value:c.value});c.continue();}else res(rows);};
    req.onerror=rej;
  });
}

/* Library */
function coverColor(id){let h=0x811c9dc5;for(let i=0;i<id.length;i++){h^=id.charCodeAt(i);h=(h*0x01000193)>>>0;}return COVER_COLORS[h%COVER_COLORS.length];}

async function renderLibrary(){
  const body=$('lib-body');
  const rows=await idbGetAll('books');
  rows.sort((a,b)=>(b.value.addedAt||0)-(a.value.addedAt||0));
  if(!rows.length){
    body.innerHTML=`<div class="lib-empty">
      <svg class="lib-empty-flamingo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
        <path d="M20 45 L10 38 L19 51 Z"/>
        <path d="M18 50 C16 42 24 37 35 37 C48 37 57 43 55 52 C54 60 45 63 35 62 C26 61 20 58 18 50 Z"/>
        <path d="M52 44 C49 30 55 20 62 12" fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round"/>
        <circle cx="63" cy="11" r="3.8"/>
      </svg>
      <div class="lib-empty-text">Your library is empty</div>
      <button class="lib-empty-btn" id="lib-empty-add">Open an EPUB…</button>
    </div>`;
    $('lib-empty-add').onclick=()=>$('file-in').click();
    return;
  }
  const grid=document.createElement('div'); grid.className='lib-grid';
  rows.forEach(({key:id,value:bk})=>{
    const bd=allData.books?.[id];
    const pct=bd?.progress?.pct?Math.round(bd.progress.pct*100):0;
    const col=coverColor(id),letter=(bk.title||'?')[0].toUpperCase();
    const card=document.createElement('div'); card.className='book-card';
    card.innerHTML=`<div class="bc-cover" style="${!bk.cover?'background:'+col:''}">
      ${bk.cover?`<img src="${bk.cover}" alt="" loading="lazy">`:
        `<div class="bc-placeholder"><div class="bc-ph-letter">${esc(letter)}</div><div class="bc-ph-title">${esc(bk.title||'')}</div></div>`}
      <button class="bc-del" data-id="${id}">✕</button>
    </div>
    <div class="bc-info">
      <div class="bc-title">${esc(bk.title||'Untitled')}</div>
      ${bk.author?`<div class="bc-author">${esc(bk.author)}</div>`:''}
      ${pct>0?`<div class="bc-prog"><div class="bc-prog-fill" style="width:${pct}%"></div></div>`:''}
    </div>`;
    card.onclick=e=>{if(e.target.closest('.bc-del'))return;openFromLibrary(id);};
    card.querySelector('.bc-del').onclick=e=>{e.stopPropagation();if(confirm('Remove "'+( bk.title||'this book')+'" from library?'))removeFromLibrary(id);};
    grid.appendChild(card);
  });
  body.innerHTML=''; body.appendChild(grid);
}

async function addToLibrary(buf,title,author,cover){
  const id=hash(title+author);
  const ex=await idbGet('books',id);
  await idbSet('books',id,{buf,cover:cover||ex?.cover||null,title,author,addedAt:ex?.addedAt||Date.now()});
}
async function openFromLibrary(id){
  const bk=await idbGet('books',id); if(!bk)return;
  await openBook(bk.buf,bk.title||id);
}
async function removeFromLibrary(id){
  await idbDel('books',id); await renderLibrary();
}
async function extractCover(epubBook){
  try{
    const url=await epubBook.coverUrl(); if(!url)return null;
    const resp=await fetch(url),blob=await resp.blob();
    return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(blob);});
  }catch(_){return null;}
}

/* Sync */
async function initSync(){
  try{const h=await idbGet('kv','syncDir');if(!h)return;const p=await h.queryPermission({mode:'readwrite'});if(p==='granted'){syncDir=h;setSyncUI(true);await loadData();}else{syncDir=h;setSyncUI(false,'Re-connect sync folder');}}catch(_){}
}
async function connectSync(){
  try{const h=await window.showDirectoryPicker({mode:'readwrite'});syncDir=h;await idbSet('kv','syncDir',h);setSyncUI(true);await loadData();}catch(e){if(e.name!=='AbortError')console.warn(e);}
}
function setSyncUI(ok,msg){$('sync-dot').className='sync-dot'+(ok?' on':'');$('sync-label').textContent=ok?`Syncing · ${syncDir.name}`:(msg||'No sync folder');}
async function loadData(){
  if(!syncDir)return;
  try{const fh=await syncDir.getFileHandle('atombook.json',{create:true});const file=await fh.getFile();const txt=await file.text();if(txt.trim())allData=JSON.parse(txt);if(!allData.books)allData.books={};}catch(e){console.warn('loadData',e);}
}
async function saveData(){
  if(!syncDir)return;
  try{const p=await syncDir.requestPermission({mode:'readwrite'});if(p!=='granted')return;const fh=await syncDir.getFileHandle('atombook.json',{create:true});const wr=await fh.createWritable();await wr.write(JSON.stringify(allData,null,2));await wr.close();}catch(e){console.warn('saveData',e);}
}
function bookData(){if(!bookId)return null;if(!allData.books[bookId])allData.books[bookId]={title:'',author:'',progress:null,hl:[]};return allData.books[bookId];}

/* Hash */
function hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0;}return h.toString(36);}

/* Theme */
const THEMES={day:{body:{background:'#FBF7F0 !important',color:'#1A1A1A !important'}},sepia:{body:{background:'#F5E9D5 !important',color:'#3B2E1E !important'}},night:{body:{background:'#1C1C1E !important',color:'#E5E0D8 !important'}}};
function setTheme(t){
  theme=t;document.body.setAttribute('data-theme',t);
  document.querySelectorAll('.lib-dot').forEach(d=>d.classList.toggle('on',d.dataset.t===t));
  document.querySelectorAll('.tp-opt').forEach(o=>o.classList.toggle('cur',o.dataset.t===t));
  $('meta-theme').content={day:'#00ADCE',sepia:'#00ADCE',night:'#005F72'}[t]||'#00ADCE';
  if(rend)rend.themes.select(t);
}

/* Font */
function getFontCSS(key){
  const f=FONTS[key]||FONTS.tnt;
  let pre='';
  if(key==='tnt'&&TNT_BLOB_URL)pre=`@font-face{font-family:"TNT Sports Serif";src:url("${TNT_BLOB_URL}") format("truetype");font-weight:400;font-style:normal;}`;
  return pre+`\nbody{font-family:${f.stack}!important;line-height:1.85!important;-webkit-font-smoothing:antialiased;}\np{text-indent:1.5em;margin-bottom:0!important;margin-top:0!important;}\nh1,h2,h3,h4,h5,h6{font-family:${f.stack}!important;line-height:1.3!important;text-indent:0!important;}\na{color:inherit!important;}`;
}
function setFont(key){
  fontKey=key;
  idbSet('kv','fontKey',key);
  document.querySelectorAll('.tp-font').forEach(b=>b.classList.toggle('cur',b.dataset.f===key));
  applyFontToIframe();
}
function applyFontToIframe(){
  if(!rend)return;
  const iframe=epubViewer.querySelector('iframe');
  if(!iframe||!iframe.contentDocument)return;
  const doc=iframe.contentDocument;
  let st=doc.getElementById('ab-font');
  if(!st){st=doc.createElement('style');st.id='ab-font';doc.head.appendChild(st);}
  st.textContent=getFontCSS(fontKey);
}

/* Font size */
function setFS(n){fontSize=Math.max(12,Math.min(30,n));$('fs-num').textContent=fontSize;if(rend)rend.themes.fontSize(fontSize+'px');}

/* Fullscreen */
function toggleFS(){
  if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}
document.addEventListener('fullscreenchange',()=>{
  const fs=!!document.fullscreenElement;
  $('fs-enter-icon').style.display=fs?'none':'block';
  $('fs-exit-icon').style.display=fs?'block':'none';
  $('fullscreen-btn').classList.toggle('lit',fs);
});

/* Open book */
async function openBook(buf,filename){
  if(typeof ePub==='undefined')throw new Error('epub.js failed to load — check your network');
  if(rend){rend.destroy();rend=null;}
  if(book){book.destroy();book=null;}
  epubViewer.innerHTML='';
  book=ePub(buf);
  await book.ready;
  const meta=book.packaging.metadata;
  const title=meta.title||(typeof filename==='string'?filename.replace(/\.epub$/i,''):'Book');
  const author=meta.creator||'';
  bookId=hash(title+author);
  const bd=bookData();bd.title=title;bd.author=author;
  $('tb-title').textContent=title;
  const wide=window.innerWidth>=860;
  rend=book.renderTo('epub-viewer',{width:epubViewer.clientWidth,height:epubViewer.clientHeight,spread:wide?'always':'none',minSpreadWidth:0,flow:'paginated'});
  epubViewer.classList.toggle('spread',wide);
  Object.entries(THEMES).forEach(([n,s])=>rend.themes.register(n,s));
  rend.themes.select(theme);
  rend.themes.fontSize(fontSize+'px');
  rend.hooks.content.register(contents=>{
    const doc=contents.document;
    if(fontKey==='tnt'||fontKey==='spectral'||fontKey==='noto'){
      const lnk=doc.createElement('link');lnk.rel='stylesheet';
      lnk.href='https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500&family=Inter:wght@300;400;500&display=swap';
      doc.head.appendChild(lnk);
    }
    const st=doc.createElement('style');st.id='ab-font';st.textContent=getFontCSS(fontKey);doc.head.appendChild(st);
  });
  rend.on('locationChanged',loc=>onLocChanged(loc));
  rend.on('selected',(cfiRange,contents)=>{
    const sel=contents.window.getSelection();if(!sel||sel.isCollapsed)return;
    const txt=sel.toString().trim();if(txt.length<2)return;
    selCfi=cfiRange;selText=txt;
    try{
      const range=sel.getRangeAt(0),rect=range.getBoundingClientRect();
      const iframe=epubViewer.querySelector('iframe');
      const iRect=iframe?iframe.getBoundingClientRect():{left:0,top:0};
      const cx=iRect.left+rect.left+rect.width/2,cy=iRect.top+rect.top-52;
      selBar.style.left=Math.max(8,Math.min(cx-115,window.innerWidth-248))+'px';
      selBar.style.top=Math.max(8,cy)+'px';
      selBar.classList.add('on');
    }catch(_){}
  });
  rend.on('deselected',()=>setTimeout(hideSelBar,180));
  const start=bookData().progress?.cfi;
  await rend.display(start||undefined);
  buildTOC();restoreHighlights();
  /* async: extract cover + save to library */
  extractCover(book).then(cover=>addToLibrary(buf,title,author,cover));
  library.style.display='none';
  reader.classList.add('on');
}

/* Navigation */
function go(dir){
  if(animating||!rend)return;
  animating=true;
  const cls=dir==='next'?'anim-next':'anim-prev';
  epubViewer.classList.add(cls);
  epubViewer.addEventListener('animationend',()=>{epubViewer.classList.remove(cls);animating=false;},{once:true});
  dir==='next'?rend.next():rend.prev();
}

/* Progress */
async function onLocChanged(loc){
  if(!loc||!book)return;
  const s=loc.start,bd=bookData();
  if(bd)bd.progress={cfi:s.cfi,pct:s.percentage,ts:Date.now()};
  const pct=Math.round((s.percentage||0)*100);
  $('prog-fill').style.width=pct+'%';$('prog-pct').textContent=pct+'%';
  try{const nav=book.navigation,item=nav&&nav.get(s.href);$('ch-title').textContent=item?(item.label?.trim()||'—'):'—';}catch(_){}
  await saveData();
}

/* TOC */
async function buildTOC(){
  const nav=book.navigation,body=$('toc-body');
  if(!nav?.toc?.length){body.innerHTML='<div class="panel-empty">No table of contents.</div>';return;}
  body.innerHTML='';
  function walk(items,depth){items.forEach(item=>{const btn=document.createElement('button');btn.className='toc-row';btn.dataset.d=depth;btn.textContent=item.label?.trim()||'Untitled';btn.onclick=()=>{rend.display(item.href);closeAll();};body.appendChild(btn);if(item.subitems?.length)walk(item.subitems,depth+1);});}
  walk(nav.toc,1);
}

/* Highlights */
function restoreHighlights(){const bd=bookData();if(!bd?.hl)return;bd.hl.forEach(h=>applyHL(h));renderNotes();}
function applyHL(h){try{rend.annotations.highlight(h.cfi,{},(()=>{}),'ab-'+h.id,{fill:HL_FILLS[h.color]||HL_FILLS.yellow,'fill-opacity':'1','mix-blend-mode':'multiply'});}catch(_){}}
function addHighlight(cfi,text,color,note=''){const bd=bookData();if(!bd)return;const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);const h={id,cfi,text,color,note,ts:Date.now()};bd.hl.push(h);applyHL(h);renderNotes();saveData();}
function delHL(id){const bd=bookData();if(!bd)return;const idx=bd.hl.findIndex(h=>h.id===id);if(idx===-1)return;try{rend.annotations.remove(bd.hl[idx].cfi,'highlight');}catch(_){}bd.hl.splice(idx,1);renderNotes();saveData();}
function editNote(id){const bd=bookData(),h=bd?.hl.find(x=>x.id===id);if(!h)return;openNoteModal(h.text,h.note||'',note=>{h.note=note;renderNotes();saveData();});}
function renderNotes(){
  const bd=bookData(),body=$('note-body');
  if(!bd?.hl?.length){body.innerHTML='<div class="panel-empty">Select text while reading<br>to highlight and annotate.</div>';return;}
  body.innerHTML='';
  [...bd.hl].reverse().forEach(h=>{
    const d=document.createElement('div');d.className='note-row';d.dataset.c=h.color;
    d.innerHTML=`<div class="note-quote">${esc(h.text.slice(0,120))}${h.text.length>120?'…':''}</div>${h.note?`<div class="note-body">${esc(h.note)}</div>`:''}<div class="note-acts"><button class="note-act" data-a="go" data-id="${h.id}">Go to</button><button class="note-act" data-a="edit" data-id="${h.id}">${h.note?'Edit note':'Add note'}</button><button class="note-act del" data-a="del" data-id="${h.id}">Delete</button></div>`;
    body.appendChild(d);
  });
  body.querySelectorAll('[data-a]').forEach(btn=>{btn.onclick=()=>{const id=btn.dataset.id,a=btn.dataset.a,bd2=bookData(),h2=bd2?.hl.find(x=>x.id===id);if(a==='go'&&h2){rend.display(h2.cfi);closeAll();}if(a==='edit')editNote(id);if(a==='del'&&confirm('Delete this highlight?'))delHL(id);};});
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* Selection bar */
function hideSelBar(){selBar.classList.remove('on');selCfi=null;selText=null;}
document.querySelectorAll('.sel-dot').forEach(btn=>{btn.onclick=()=>{if(selCfi&&selText)addHighlight(selCfi,selText,btn.dataset.c);hideSelBar();};});
$('sel-note').onclick=()=>{if(!selText)return;pendingHl={cfi:selCfi,text:selText,color:'yellow'};hideSelBar();openNoteModal(selText,'',note=>{if(pendingHl){addHighlight(pendingHl.cfi,pendingHl.text,pendingHl.color,note);pendingHl=null;}});};

/* Note modal */
function openNoteModal(q,ex,cb){$('nm-quote').textContent=q.slice(0,140)+(q.length>140?'…':'');$('nm-ta').value=ex||'';nmCb=cb;noteModal.classList.add('on');setTimeout(()=>$('nm-ta').focus(),60);}
function closeNoteModal(){noteModal.classList.remove('on');nmCb=null;pendingHl=null;}
$('nm-save').onclick=()=>{if(nmCb)nmCb($('nm-ta').value.trim());closeNoteModal();};
$('nm-cancel').onclick=closeNoteModal;
noteModal.onclick=e=>{if(e.target===noteModal)closeNoteModal();};

/* Panels */
let tocOpen=false,notesOpen=false,themeOpen=false;
function closeAll(){tocOpen=notesOpen=themeOpen=false;$('toc-panel').classList.remove('open');$('note-panel').classList.remove('open');$('theme-pop').classList.remove('on');overlay.classList.remove('on');$('toc-btn').classList.remove('lit');$('notes-btn').classList.remove('lit');$('theme-btn').classList.remove('lit');}
function toggleTOC(){tocOpen=!tocOpen;notesOpen=themeOpen=false;$('toc-panel').classList.toggle('open',tocOpen);$('note-panel').classList.remove('open');$('theme-pop').classList.remove('on');overlay.classList.toggle('on',tocOpen);$('toc-btn').classList.toggle('lit',tocOpen);$('notes-btn').classList.remove('lit');$('theme-btn').classList.remove('lit');}
function toggleNotes(){notesOpen=!notesOpen;tocOpen=themeOpen=false;renderNotes();$('note-panel').classList.toggle('open',notesOpen);$('toc-panel').classList.remove('open');$('theme-pop').classList.remove('on');overlay.classList.toggle('on',notesOpen);$('notes-btn').classList.toggle('lit',notesOpen);$('toc-btn').classList.remove('lit');$('theme-btn').classList.remove('lit');}
function toggleThemePop(e){e.stopPropagation();themeOpen=!themeOpen;$('theme-pop').classList.toggle('on',themeOpen);$('theme-btn').classList.toggle('lit',themeOpen);}

/* Events */
const fileIn=$('file-in');
async function loadFile(f){
  try{const buf=await f.arrayBuffer();await openBook(buf,f.name);}
  catch(e){
    console.error('AtomBook:',e);
    library.style.display='flex';reader.classList.remove('on');
    const sub=document.querySelector('.lib-empty-text');
    if(sub){sub.textContent='Could not open: '+(e?.message||String(e));setTimeout(()=>{sub.textContent='Your library is empty';},5000);}
  }
}
fileIn.onchange=e=>{const f=e.target.files[0];if(f)loadFile(f);fileIn.value='';};
$('lib-open-btn').onclick=()=>fileIn.click();
[library,document].forEach(el=>{
  el.addEventListener('dragover',e=>{e.preventDefault();if(el===library)library.classList.add('drag-over');});
  el.addEventListener('dragleave',()=>library.classList.remove('drag-over'));
  el.addEventListener('drop',e=>{e.preventDefault();library.classList.remove('drag-over');const f=e.dataTransfer.files[0];if(f?.name.endsWith('.epub'))loadFile(f);});
});
$('sync-btn').onclick=connectSync;
document.querySelectorAll('.lib-dot').forEach(d=>d.onclick=()=>setTheme(d.dataset.t));
document.querySelectorAll('.tp-opt').forEach(o=>o.onclick=()=>{setTheme(o.dataset.t);themeOpen=false;$('theme-pop').classList.remove('on');$('theme-btn').classList.remove('lit');});
document.querySelectorAll('.tp-font').forEach(b=>b.onclick=()=>setFont(b.dataset.f));
$('toc-btn').onclick=toggleTOC;$('notes-btn').onclick=toggleNotes;$('theme-btn').onclick=toggleThemePop;
$('toc-x').onclick=closeAll;$('note-x').onclick=closeAll;overlay.onclick=closeAll;
$('fullscreen-btn').onclick=toggleFS;
$('home-btn').onclick=()=>{closeAll();reader.classList.remove('on');library.style.display='flex';if(rend){rend.destroy();rend=null;}if(book){book.destroy();book=null;}epubViewer.innerHTML='';$('tb-title').textContent='—';$('ch-title').textContent='—';$('prog-fill').style.width='0%';$('prog-pct').textContent='0%';renderLibrary();};
$('fs-down').onclick=()=>setFS(fontSize-1);$('fs-up').onclick=()=>setFS(fontSize+1);
$('prev-btn').onclick=()=>go('prev');$('next-btn').onclick=()=>go('next');
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){e.preventDefault();go('next');}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go('prev');}
  if(e.key==='Escape')closeAll();
  if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey)toggleFS();
});
document.addEventListener('click',e=>{if(themeOpen&&!$('theme-pop').contains(e.target)&&e.target!==$('theme-btn')){themeOpen=false;$('theme-pop').classList.remove('on');$('theme-btn').classList.remove('lit');}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!rend)return;const w=epubViewer.clientWidth,h=epubViewer.clientHeight,wide=w>=860;epubViewer.classList.toggle('spread',wide);rend.resize(w,h);},200);});

/* Init */
(async()=>{
  const sf=await idbGet('kv','fontKey');if(sf&&FONTS[sf]){fontKey=sf;document.querySelectorAll('.tp-font').forEach(b=>b.classList.toggle('cur',b.dataset.f===sf));}
  await initSync();
  document.querySelectorAll('.lib-dot').forEach(d=>d.classList.toggle('on',d.dataset.t===theme));
  await renderLibrary();
})();
</script>
</body>
</html>
